<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 306 306" fill="none">
  <!-- Globe for "Built for Bangladesh" (Figma Ellipse 10, 249:22196). A code copy of the Figma video
       fill, rebuilt from measurements of the video (5 s loop, 30 fps):
         • globe grid  – outline r104, 2 pairs of meridians (0.40 r and 0.72 r wide), latitudes at 0 and ±30°;
                         the whole grid rolls clockwise 0° → 36° over the 5 s loop, then starts again
         • orbit       – dashed ellipse 146 × 62.2 (does not roll)
         • orbit dot   – one lap per loop, clockwise from the right end; solid blue on the front half,
                         pale on the back half; moves like a real circular orbit (slow at the ends)
         • cube        – bobs ±8.3 twice per loop (its shadow shrinks as it rises) and rocks ±6° once per loop
       All values to tweak are in the "Settings" block. -->
  <style>
    /* ── Settings ───────────────────────────────────────────── */
    svg {
      --loop: 5s;            /* one full cycle (dot lap, grid roll) */
      --bob: 1.25s;          /* half a cube bob (2 bobs per loop) */
    }
    .rim   { stroke: #a7b8dc; stroke-width: 0.75; }
    .mer   { stroke: #c3d0ea; stroke-width: 0.75; }
    .lat   { stroke: #d2def0; stroke-width: 0.75; }
    .orbit { stroke: #c4d0e6; stroke-width: 0.7; stroke-dasharray: 3.5 9; }
    .dot   { fill: #3282fb; }   /* front half */
    @keyframes dot-depth {     /* back half: pale */
      0%, 49.99%   { fill: #3282fb; }
      50%, 99.99%  { fill: #c7d9f7; }
      100%         { fill: #3282fb; }
    }
    @keyframes roll { from { transform: rotate(0deg); } to { transform: rotate(36deg); } }
    /* ─────────────────────────────────────────────────────── */

    .grid { transform-box: view-box; transform-origin: 153px 153px; }
    /* resting pose = the video's first frame: dot at the right end of the orbit */
    .dot-x { transform: translateX(146px); }
    .dot-y { transform: translateY(0); }

    @media (prefers-reduced-motion: no-preference) {
      .grid { animation: roll var(--loop) linear infinite; }
      /* circular orbit seen at an angle: x = 146·cos, y = 62.2·sin (sine-eased back-and-forth on
         each axis, y a quarter-cycle behind x) */
      .dot-x { animation: dot-x calc(var(--loop) / 2) cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .dot-y { animation: dot-y calc(var(--loop) / 2) cubic-bezier(0.37, 0, 0.63, 1) calc(var(--loop) / -4) infinite alternate; }
      .dot { animation: dot-depth var(--loop) linear infinite; }
      /* cube: y = 0.8 + 8.3·sin, starting mid-way and heading down, as in the video */
      .cube { animation: bob var(--bob) cubic-bezier(0.37, 0, 0.63, 1) calc(var(--bob) / -2) infinite alternate; }
      .rock { animation: rock calc(var(--loop) / 2) cubic-bezier(0.37, 0, 0.63, 1) calc(var(--loop) / -4) infinite alternate; }
      .shadow { animation: shade var(--bob) cubic-bezier(0.37, 0, 0.63, 1) calc(var(--bob) / -2) infinite alternate; }
    }
    @keyframes dot-x { from { transform: translateX(146px); } to { transform: translateX(-146px); } }
    @keyframes dot-y { from { transform: translateY(-62.2px); } to { transform: translateY(62.2px); } }
    @keyframes rock { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
    @keyframes bob { from { transform: translateY(-8.3px); } to { transform: translateY(8.3px); } }
    .shadow { transform-box: fill-box; transform-origin: center; }
    @keyframes shade { from { transform: scale(0.78); opacity: 0.7; } to { transform: scale(1); opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="cube-top" x1="0" y1="-24.4" x2="0" y2="-0.4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6aaeff" /><stop offset="1" stop-color="#559dfc" />
    </linearGradient>
    <linearGradient id="cube-left" x1="0" y1="-12.4" x2="0" y2="24.4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2369f1" /><stop offset="1" stop-color="#1b62ee" />
    </linearGradient>
    <linearGradient id="cube-right" x1="0" y1="-12.4" x2="0" y2="24.4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3786fb" /><stop offset="1" stop-color="#2f7ef9" />
    </linearGradient>
  </defs>

  <circle cx="153" cy="153" r="153" fill="#fff" />

  <!-- globe grid (rolls) -->
  <g class="grid">
    <ellipse class="mer" cx="153" cy="153" rx="41.6" ry="104" />
    <ellipse class="mer" cx="153" cy="153" rx="74.9" ry="104" />
    <line class="lat" x1="62.93" y1="101" x2="243.07" y2="101" />
    <line class="lat" x1="49" y1="153" x2="257" y2="153" />
    <line class="lat" x1="62.93" y1="205" x2="243.07" y2="205" />
    <circle class="rim" cx="153" cy="153" r="104" />
  </g>

  <!-- orbit + dot -->
  <ellipse class="orbit" cx="153" cy="153" rx="146" ry="62.2" />
  <g transform="translate(153 153)">
    <g class="dot-x"><g class="dot-y"><circle class="dot" r="2.8" /></g></g>
  </g>

  <!-- cube shadow + cube (isometric cube, edge 30, viewed 35° from above; centre on the globe centre) -->
  <g transform="translate(153 153)">
    <ellipse class="shadow" cx="0" cy="32.5" rx="13.5" ry="4.4" fill="#e5e5e5" />
    <g class="cube"><g class="rock">
      <path d="M0 -24.4 L21.2 -12.4 L0 -0.4 L-21.2 -12.4 Z" fill="url(#cube-top)" />
      <path d="M-21.2 -12.4 L0 -0.4 L0 24.4 L-21.2 12.4 Z" fill="url(#cube-left)" />
      <path d="M21.2 -12.4 L0 -0.4 L0 24.4 L21.2 12.4 Z" fill="url(#cube-right)" />
      <!-- highlight panel on the top face (parallel to the back-left edge) -->
      <path d="M-6.4 -10 L4.2 -16 L-1.1 -19 L-11.7 -13 Z" fill="#fff" opacity="0.3" />
    </g></g>
  </g>
</svg>
