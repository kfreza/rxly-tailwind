<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 306 306" fill="none">
  <!-- Stand-in for the Figma video fill on Ellipse 10 (249:22196): wireframe globe + blue cube.
       Replace with the original video when available (see docs/BRIEF.md). -->
  <style>
    .ln { stroke: #c7d5ec; stroke-width: 1; }
    .dash { stroke: #9fbdf0; stroke-width: 1; stroke-dasharray: 3 4; }
    @media (prefers-reduced-motion: no-preference) {
      .m1 { animation: spin 9s linear infinite; }
      .m2 { animation: spin 9s linear infinite -3s; }
      .m3 { animation: spin 9s linear infinite -6s; }
      .cube { animation: bob 4s ease-in-out infinite; transform-origin: 153px 150px; }
      .shadow { animation: shade 4s ease-in-out infinite; transform-origin: 153px 186px; }
    }
    @keyframes spin {
      0% { rx: 0; opacity: 0.2; }
      25% { rx: 72; opacity: 1; }
      50% { rx: 0; opacity: 0.2; }
      75% { rx: 72; opacity: 1; }
      100% { rx: 0; opacity: 0.2; }
    }
    @keyframes bob { 50% { transform: translateY(-5px); } }
    @keyframes shade { 50% { transform: scale(0.85); opacity: 0.6; } }
  </style>
  <circle cx="153" cy="153" r="153" fill="#fff" />
  <!-- equator orbit -->
  <ellipse class="dash" cx="153" cy="153" rx="104" ry="34" />
  <!-- globe -->
  <circle class="ln" cx="153" cy="153" r="72" />
  <ellipse class="ln" cx="153" cy="153" rx="72" ry="22" />
  <line class="ln" x1="85" y1="129" x2="221" y2="129" />
  <line class="ln" x1="85" y1="177" x2="221" y2="177" />
  <line class="ln" x1="153" y1="81" x2="153" y2="225" />
  <ellipse class="ln m1" cx="153" cy="153" rx="36" ry="72" />
  <ellipse class="ln m2" cx="153" cy="153" rx="60" ry="72" />
  <ellipse class="ln m3" cx="153" cy="153" rx="18" ry="72" />
  <!-- shadow -->
  <ellipse class="shadow" cx="153" cy="186" rx="15" ry="5" fill="#d6dbe3" />
  <!-- cube -->
  <g class="cube">
    <path d="M153 126 L170 135 L153 144 L136 135 Z" fill="#5b9bff" />
    <path d="M136 135 L153 144 L153 165 L136 156 Z" fill="#066afe" />
    <path d="M170 135 L153 144 L153 165 L170 156 Z" fill="#0450c4" />
    <path d="M153 126 L170 135 L153 144 L136 135 Z" fill="url(#shine)" opacity="0.5" />
  </g>
  <defs>
    <linearGradient id="shine" x1="136" y1="126" x2="170" y2="144" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.8" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
  </defs>
</svg>
