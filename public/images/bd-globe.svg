<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 306 306" fill="none">
  <!-- Stand-in for the Figma video fill on Ellipse 10 (249:22196): wireframe globe, orbit and blue cube.
       Geometry measured from the Figma render (306×306 frame, centre 153,153). The first frame matches
       Figma; then the meridians turn, the dot travels the orbit and the cube floats.
       Replace with the original video when available (see docs/BRIEF.md). -->
  <style>
    .ln { stroke: #c9d6ec; stroke-width: 1; }
    .lat { stroke: #dbe5f4; stroke-width: 1; }
    .orbit { stroke: #a9c3ee; stroke-width: 1; stroke-dasharray: 3 4; }
    .dot { transform: translate(299px, 153px); }
    @media (prefers-reduced-motion: no-preference) {
      .m1 { animation: m1 10s linear infinite; }
      .m2 { animation: m2 10s linear infinite; }
      .cube { animation: bob 4s ease-in-out infinite; }
      .shadow { animation: shade 4s ease-in-out infinite; transform-origin: 153px 186px; }
      .dot { transform: none; offset-path: path('M299 153 A146 63 0 1 1 7 153 A146 63 0 1 1 299 153'); offset-rotate: 0deg; animation: orbit 12s linear infinite; }
    }
    /* meridians sweep across the sphere (rx 75 → 0 → 104 …), starting at Figma's frame */
    @keyframes m1 { 0% { rx: 75px; } 35% { rx: 0px; } 36% { rx: 104px; } 100% { rx: 75px; } }
    @keyframes m2 { 0% { rx: 41px; } 20% { rx: 0px; } 21% { rx: 104px; } 100% { rx: 41px; } }
    @keyframes bob { 50% { transform: translateY(-5px); } }
    @keyframes shade { 50% { transform: scale(0.82); opacity: 0.6; } }
    @keyframes orbit { from { offset-distance: 0%; } to { offset-distance: 100%; } }
  </style>
  <defs>
    <linearGradient id="top" x1="131" y1="128" x2="175" y2="152" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7fb2ff" /><stop offset="1" stop-color="#4d8dff" />
    </linearGradient>
    <linearGradient id="left" x1="131" y1="140" x2="153" y2="178" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3f82ff" /><stop offset="1" stop-color="#2468f5" />
    </linearGradient>
    <linearGradient id="right" x1="175" y1="140" x2="153" y2="178" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a6cf6" /><stop offset="1" stop-color="#1552d8" />
    </linearGradient>
  </defs>

  <circle cx="153" cy="153" r="153" fill="#fff" />

  <!-- globe: outline, two meridians, two latitudes, equator -->
  <circle class="ln" cx="153" cy="153" r="104" />
  <ellipse class="ln m1" cx="153" cy="153" rx="75" ry="104" />
  <ellipse class="ln m2" cx="153" cy="153" rx="41" ry="104" />
  <line class="lat" x1="63" y1="101" x2="243" y2="101" />
  <line class="lat" x1="63" y1="205" x2="243" y2="205" />
  <line class="lat" x1="49" y1="153" x2="257" y2="153" />

  <!-- dashed orbit + travelling dot (starts at the right end, as in Figma) -->
  <ellipse class="orbit" cx="153" cy="153" rx="146" ry="63" />
  <circle class="dot" cx="0" cy="0" r="3.5" fill="#2f6ff5" />

  <!-- cube shadow -->
  <ellipse class="shadow" cx="153" cy="186" rx="17" ry="4.5" fill="#dcdcdc" />

  <!-- cube (≈43px wide, centred on the globe) -->
  <g class="cube">
    <path d="M153 128 L174.5 140 L153 152 L131.5 140 Z" fill="url(#top)" />
    <path d="M131.5 140 L153 152 L153 178 L131.5 166 Z" fill="url(#left)" />
    <path d="M174.5 140 L153 152 L153 178 L174.5 166 Z" fill="url(#right)" />
    <path d="M146 135.5 L156.5 129.6 L161 132.2 L150.5 138.1 Z" fill="#fff" opacity="0.35" />
  </g>
</svg>
