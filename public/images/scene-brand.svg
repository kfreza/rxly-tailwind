<svg xmlns="http://www.w3.org/2000/svg" width="416" height="240" viewBox="0 0 416 240" role="img" aria-label="Illustration of a branded prescription page, a booking page and a handled certificate">
  <defs>
    <style><![CDATA[
      svg{
        --brand:#066AFE;
        --brand-2:#4992FE;
        --mint:#12B886;
      }

      /* ---------- entrance ---------- */
      .enter{
        opacity:0;
        transform-box:view-box;
        animation:enter .9s cubic-bezier(.22,.9,.32,1) var(--d,0s) forwards;
      }
      @keyframes enter{
        from{ opacity:0; transform:translateY(18px) scale(.93); }
        to  { opacity:1; transform:translateY(0)    scale(1);   }
      }
      #card-page   { transform-origin:88px 124px;  }
      #card-browser{ transform-origin:216px 119px; }
      #card-cert   { transform-origin:352px 112px; }

      /* ---------- gentle float ---------- */
      .float{
        transform-box:view-box;
        animation:float 6s ease-in-out infinite;
      }
      @keyframes float{
        0%,100%{ transform:translateY(0);    }
        50%    { transform:translateY(-5px); }
      }
      .float-a{ animation-duration:7s;   animation-delay:-1.2s; }
      .float-b{ animation-duration:6.4s; animation-delay:-3.0s; }
      .float-c{ animation-duration:5.2s; animation-delay:-2.0s; }

      /* ---------- inner motion ---------- */
      .logo-pulse,.twinkle,.ping,.spin,.urlbar{
        transform-box:fill-box;
        transform-origin:center;
      }

      .logo-pulse{ animation:logoPulse 3.6s ease-in-out infinite; }
      @keyframes logoPulse{
        0%,100%{ transform:scale(1);    }
        50%    { transform:scale(1.12); }
      }

      .draw{
        stroke-dasharray:30;
        stroke-dashoffset:30;
        animation:draw 1s 1.1s cubic-bezier(.3,.9,.3,1) forwards;
      }
      @keyframes draw{ to{ stroke-dashoffset:0; } }

      .ping{ animation:ping 2.6s cubic-bezier(0,.6,.4,1) infinite; }
      @keyframes ping{
        0%  { transform:scale(.6); opacity:.55; }
        70% { transform:scale(2.1); opacity:0;  }
        100%{ transform:scale(2.1); opacity:0;  }
      }

      .spin{ animation:spin 24s linear infinite; }
      @keyframes spin{ to{ transform:rotate(360deg); } }

      .urlbar{
        transform-origin:left center;
        animation:urlFill 5s ease-in-out infinite;
      }
      @keyframes urlFill{
        0%,8%    { transform:scaleX(.12); }
        50%,88%  { transform:scaleX(1);   }
        100%     { transform:scaleX(.12); }
      }

      .twinkle{ animation:twinkle 3.4s ease-in-out infinite; }
      @keyframes twinkle{
        0%,100%{ opacity:.2; transform:scale(.7); }
        50%    { opacity:1;  transform:scale(1);  }
      }

      /* ---------- accessibility ---------- */
      @media (prefers-reduced-motion: reduce){
        .enter,.float,.logo-pulse,.twinkle,.ping,.spin,.urlbar,.draw{
          animation:none !important;
          opacity:1 !important;
        }
        .enter,.urlbar{ transform:none !important; }
        .draw{ stroke-dashoffset:0 !important; }
      }
    ]]></style>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFCFE"/>
      <stop offset="1" stop-color="#EDF1FA"/>
    </linearGradient>

    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4992FE"/>
      <stop offset="1" stop-color="#066AFE"/>
    </linearGradient>

    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#CFD8EC"/>
    </pattern>

    <pattern id="cal" x="37" y="75.5" width="17" height="12" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" rx="2.5" fill="#DDE7F6"/>
    </pattern>

    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#1B2559" flood-opacity="0.12"/>
    </filter>

    <filter id="badgeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1B2559" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- ============ BACKDROP ============ -->
  <rect width="416" height="240" fill="url(#bgGrad)"/>
  <circle cx="344" cy="30"  r="78" fill="#3586FE" opacity="0.07"/>
  <circle cx="46"  cy="216" r="88" fill="#12B886" opacity="0.05"/>
  <rect width="416" height="240" fill="url(#dots)" opacity="0.45"/>

  <!-- ambient sparkles -->
  <circle class="twinkle" cx="26"  cy="34"  r="2.6" fill="#8CBAFF"/>
  <circle class="twinkle" cx="392" cy="58"  r="2.2" fill="#8CBAFF" style="animation-delay:-1.1s"/>
  <circle class="twinkle" cx="30"  cy="204" r="2.2" fill="#8AD9C4" style="animation-delay:-2.2s"/>
  <circle class="twinkle" cx="386" cy="196" r="2.8" fill="#8CBAFF" style="animation-delay:-0.6s"/>

  <!-- ============================================================
       CERTIFICATE (handled for you)
  ============================================================ -->
  <g id="card-cert" class="enter" style="--d:.34s">
    <g class="float float-c">
      <g transform="translate(352,112)">
        <path d="M-9 16 L-9 44 L-1.5 38 L6 44 L6 16 Z" fill="#D0E3FF"/>

        <circle r="30" fill="#FFFFFF" filter="url(#badgeShadow)"/>
        <circle class="spin" r="36" fill="none" stroke="#B2D1FF" stroke-width="1.6"
                stroke-dasharray="2.5 9" stroke-linecap="round"/>
        <circle r="30" fill="none" stroke="url(#brandGrad)" stroke-width="2.6"/>
        <circle r="20.5" fill="#EDF4FF"/>

        <path class="draw" d="M-8 0.5 L-2.4 6.6 L8.2 -6"
              fill="none" stroke="url(#brandGrad)" stroke-width="3.4"
              stroke-linecap="round" stroke-linejoin="round"
              style="animation-delay:1.15s"/>
      </g>
    </g>
  </g>

  <!-- ============================================================
       PRESCRIPTION PAGE (your logo on every page & prescription)
  ============================================================ -->
  <g id="card-page" class="enter" style="--d:.16s">
    <g class="float float-a">
      <g transform="translate(36,58) rotate(-6 52 66)">
        <rect x="0" y="0" width="104" height="132" rx="13" fill="#FFFFFF" filter="url(#cardShadow)"/>
        <rect x=".5" y=".5" width="103" height="131" rx="12.5" fill="none" stroke="#E8ECF5"/>

        <g class="logo-pulse">
          <rect x="14" y="14" width="17" height="17" rx="5.5" fill="url(#brandGrad)"/>
          <circle cx="22.5" cy="22.5" r="3.2" fill="#FFFFFF" opacity=".95"/>
        </g>

        <rect x="38" y="17" width="46" height="5" rx="2.5" fill="#DFE5F1"/>
        <rect x="38" y="26" width="28" height="5" rx="2.5" fill="#EDF0F8"/>

        <rect x="14" y="44" width="76" height="1.4" rx=".7" fill="#EEF1F8"/>

        <rect x="14" y="54" width="76" height="5" rx="2.5" fill="#E6EBF5"/>
        <rect x="14" y="65" width="58" height="5" rx="2.5" fill="#EFF2F9"/>
        <rect x="14" y="76" width="66" height="5" rx="2.5" fill="#EFF2F9"/>

        <rect x="14" y="92" width="34" height="14" rx="7" fill="#EDF1FA"/>
        <path d="M31 92 H41 A7 7 0 0 1 41 106 H31 Z" fill="#BFE9DA"/>

        <circle cx="74" cy="99" r="13" fill="#EAF9F3"/>
        <path class="draw" d="M68.5 99.4 L72.4 103.3 L79.8 95.6"
              fill="none" stroke="#12B886" stroke-width="2.6"
              stroke-linecap="round" stroke-linejoin="round"
              style="animation-delay:1.5s"/>
      </g>
    </g>
  </g>

  <!-- ============================================================
       BOOKING PAGE (your colours + your own web address)
  ============================================================ -->
  <g id="card-browser" class="enter" style="--d:.06s">
    <g class="float float-b">
      <g transform="translate(132,44)">
        <rect x="0" y="0" width="168" height="150" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>

        <path d="M14 0 H154 A14 14 0 0 1 168 14 V26 H0 V14 A14 14 0 0 1 14 0 Z" fill="#F5F7FC"/>
        <line x1="0" y1="26" x2="168" y2="26" stroke="#E8ECF5" stroke-width="1.2"/>
        <circle cx="15" cy="13" r="3" fill="#DBE2EE"/>
        <circle cx="26" cy="13" r="3" fill="#DBE2EE"/>
        <circle cx="37" cy="13" r="3" fill="#DBE2EE"/>

        <rect x="48" y="6.5" width="106" height="13" rx="6.5" fill="#FFFFFF" stroke="#E4E9F3"/>
        <circle cx="58.5" cy="13" r="3" fill="url(#brandGrad)"/>
        <rect x="67" y="11" width="68" height="4" rx="2" fill="#E7EDF7"/>
        <rect class="urlbar" x="67" y="11" width="68" height="4" rx="2" fill="url(#brandGrad)"/>

        <g class="logo-pulse">
          <rect x="14" y="42" width="18" height="18" rx="6" fill="url(#brandGrad)"/>
          <circle cx="23" cy="51" r="3.4" fill="#FFFFFF" opacity=".95"/>
        </g>
        <rect x="40" y="45" width="62" height="5" rx="2.5" fill="#E2E8F3"/>
        <rect x="40" y="54" width="40" height="5" rx="2.5" fill="#EEF1F8"/>

        <rect x="14" y="70" width="140" height="44" rx="11" fill="#EEF5FF"/>
        <rect x="37" y="75.5" width="94" height="33" fill="url(#cal)"/>

        <circle class="ping" cx="75.5" cy="92" r="5" fill="#3586FE" opacity=".5"/>
        <rect x="71" y="87.5" width="9" height="9" rx="2.5" fill="url(#brandGrad)"/>

        <rect x="14" y="122" width="72" height="16" rx="8" fill="url(#brandGrad)"/>
        <rect x="30" y="128.5" width="40" height="3" rx="1.5" fill="#FFFFFF" opacity=".9"/>
      </g>
    </g>
  </g>
</svg>