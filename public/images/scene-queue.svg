<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 240" width="416" height="240" role="img" aria-label="Animated queue flow: phone, walk-in or link booking; ticket and message; waiting-room display; call next.">
    <!--Self-contained animated SVG, 416 x 240 pixels, 10-second seamless loop. No scripts or external resources.--><defs>
      <filter id="sh" x="-30%" y="-30%" width="160%" height="180%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#15233A" flood-opacity="0.08"/>
      </filter>
      <clipPath id="tvClip"><rect x="280" y="50" width="108" height="84" rx="8"/></clipPath>
    </defs>

    <rect width="416" height="240" rx="18" fill="#F2F5FA"/>

    <g id="scene">

      <!-- connective chevrons -->
      <g id="chev" fill="none" stroke="#B9C7DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path class="c" d="M73 115.5 L78 120 L73 124.5"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.0s" repeatCount="indefinite"/></path>
        <path class="c" d="M160 115.5 L165 120 L160 124.5"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.3s" repeatCount="indefinite"/></path>
        <path class="c" d="M255 115.5 L260 120 L255 124.5"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" repeatCount="indefinite"/></path>
      </g>

      <!-- 1 · phone -->
      <g id="phone">
        <rect x="20" y="52" width="40" height="40" rx="12" fill="#fff" filter="url(#sh)"/>
        <g transform="translate(28,60)" fill="none" stroke="#3E6DF3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0400;0.1050;1" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.18 0.8 0.3 1;0 0 1 1"/><animateTransform attributeName="transform" type="translate" values="0 7;0 7;0 0;0 0" keyTimes="0;0.0400;0.1050;1" dur="10s" repeatCount="indefinite"/></g>

      <!-- 1 · walk-in -->
      <g id="walkin">
        <rect x="20" y="100" width="40" height="40" rx="12" fill="#fff" filter="url(#sh)"/>
        <g transform="translate(28,108)" fill="none" stroke="#F0954E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0700;0.1350;1" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.18 0.8 0.3 1;0 0 1 1"/><animateTransform attributeName="transform" type="translate" values="0 7;0 7;0 0;0 0" keyTimes="0;0.0700;0.1350;1" dur="10s" repeatCount="indefinite"/></g>

      <!-- 1 · link -->
      <g id="link">
        <rect x="20" y="148" width="40" height="40" rx="12" fill="#fff" filter="url(#sh)"/>
        <g transform="translate(28,156)" fill="none" stroke="#46B79B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1000;0.1650;1" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.18 0.8 0.3 1;0 0 1 1"/><animateTransform attributeName="transform" type="translate" values="0 7;0 7;0 0;0 0" keyTimes="0;0.1000;0.1650;1" dur="10s" repeatCount="indefinite"/></g>

      <!-- 2 · the serial -->
      <g id="ticket">
        <rect x="92" y="97" width="58" height="46" rx="10" fill="#fff" filter="url(#sh)"/>
        <line x1="122" y1="104" x2="122" y2="136" stroke="#DCE5F3" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round"/>
        <circle cx="107" cy="114" r="7.5" fill="#3E6DF3"/>
        <path d="M103.6 114.2 l2.3 2.3 l4.4 -4.7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="99" y="127" width="16" height="4" rx="2" fill="#DCE5F3"/>
        <rect x="129" y="110" width="3" height="20" rx="1.5" fill="#CBD8EC"/>
        <rect x="135" y="110" width="3" height="20" rx="1.5" fill="#CBD8EC"/>
        <rect x="141" y="110" width="3" height="20" rx="1.5" fill="#CBD8EC"/>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2000;0.2750;1" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.18 0.8 0.3 1;0 0 1 1"/><animateTransform attributeName="transform" type="translate" values="0 7;0 7;0 0;0 0" keyTimes="0;0.2000;0.2750;1" dur="10s" repeatCount="indefinite"/></g>

      <!-- 3 · the text with its time -->
      <g id="msg">
        <path d="M190 136 L190 149 L202 136 Z" fill="#3E6DF3"/>
        <rect x="176" y="96" width="68" height="44" rx="14" fill="#3E6DF3"/>
        <circle cx="192" cy="118" r="7.5" fill="none" stroke="#fff" stroke-width="2"/>
        <path d="M192 114 v4 h3.2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="206" y="108" width="32" height="6" rx="3" fill="#fff" opacity=".95"/>
        <rect x="206" y="119" width="22" height="5" rx="2.5" fill="#fff" opacity=".6"/>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3300;0.4050;1" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.18 0.8 0.3 1;0 0 1 1"/><animateTransform attributeName="transform" type="translate" values="0 7;0 7;0 0;0 0" keyTimes="0;0.3300;0.4050;1" dur="10s" repeatCount="indefinite"/></g>

      <!-- 4 · waiting-room screen -->
      <g id="tv">
        <rect x="272" y="42" width="124" height="100" rx="14" fill="#fff" filter="url(#sh)"/>
        <rect x="280" y="50" width="108" height="84" rx="8" fill="#E9EFFA"/>

        <g clip-path="url(#tvClip)">
          <g id="pill">
            <rect x="284" y="57" width="100" height="22" rx="7" fill="#fff" stroke="#BFD3F7" stroke-width="1.5"/>
            <path d="M368 64 L373 68 L368 72" fill="none" stroke="#3E6DF3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4000;0.4500;1" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.18 0.8 0.3 1;0 0 1 1"/><animateTransform attributeName="transform" type="translate" values="0 7;0 7;0 0;0 0" keyTimes="0;0.4000;0.4500;1" dur="10s" repeatCount="indefinite"/></g>

          <g id="rowA">
            <circle cx="298" cy="68" r="8.5" fill="#3E6DF3"/>
            <rect x="312" y="61.5" width="34" height="5" rx="2.5" fill="#9FB6E8"/>
            <rect x="312" y="69.5" width="22" height="4.5" rx="2.25" fill="#C3D2EC"/>
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.230;0.270;.60;.70;1" dur="10s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;24 0;24 0" keyTimes="0;.60;.70;1" dur="10s" repeatCount="indefinite"/></g>

          <g id="rowB">
            <circle cx="298" cy="94" r="8.5" fill="#F0954E"/>
            <rect x="312" y="87.5" width="30" height="5" rx="2.5" fill="#C6D2E4"/>
            <rect x="312" y="95.5" width="20" height="4.5" rx="2.25" fill="#D8E1EE"/>
          <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.290;1" dur="10s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -26;0 -26" keyTimes="0;.68;.78;1" dur="10s" repeatCount="indefinite"/></g>

          <g id="rowC">
            <circle cx="298" cy="120" r="8.5" fill="#46B79B"/>
            <rect x="312" y="113.5" width="26" height="5" rx="2.5" fill="#C6D2E4"/>
            <rect x="312" y="121.5" width="18" height="4.5" rx="2.25" fill="#D8E1EE"/>
          <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.270;0.310;1" dur="10s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -26;0 -26" keyTimes="0;.68;.78;1" dur="10s" repeatCount="indefinite"/></g>

          <g id="rowD">
            <circle cx="298" cy="120" r="8.5" fill="#9B8CF0"/>
            <rect x="312" y="113.5" width="28" height="5" rx="2.5" fill="#C6D2E4"/>
            <rect x="312" y="121.5" width="19" height="4.5" rx="2.25" fill="#D8E1EE"/>
          <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.68;.78;1" dur="10s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 26;0 26;0 0;0 0" keyTimes="0;.68;.78;1" dur="10s" repeatCount="indefinite"/></g>
        </g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1600;0.2200;1" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.18 0.8 0.3 1;0 0 1 1"/><animateTransform attributeName="transform" type="translate" values="0 7;0 7;0 0;0 0" keyTimes="0;0.1600;0.2200;1" dur="10s" repeatCount="indefinite"/></g>

      <!-- 5 · call next -->
      <circle id="ripple" cx="334" cy="170" r="16" fill="none" stroke="#3E6DF3" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;.55;0;0" keyTimes="0;.55;.59;.75;1" dur="10s" repeatCount="indefinite"/><animate attributeName="r" values="7;7;15;32;32" keyTimes="0;.55;.59;.75;1" dur="10s" repeatCount="indefinite"/></circle>
      <g id="btn">
        <g id="btnInner">
          <rect x="290" y="156" width="88" height="28" rx="14" fill="#3E6DF3" filter="url(#sh)"/>
          <path d="M326.5 163 L336 170 L326.5 177 Z" fill="#fff"/>
          <rect x="338.5" y="163.5" width="3" height="13" rx="1.5" fill="#fff"/>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4400;0.5000;1" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.18 0.8 0.3 1;0 0 1 1"/><animateTransform attributeName="transform" type="translate" values="0 7;0 7;0 0;0 0" keyTimes="0;0.4400;0.5000;1" dur="10s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 2;0 0;0 0" keyTimes="0;.52;.56;.60;1" dur="10s" repeatCount="indefinite" additive="sum"/></g>
      </g>

    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.03;.91;1" dur="10s" repeatCount="indefinite"/></g>
  </svg>
